version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Install everything — Amplify sets NODE_ENV at runtime but we need
        # devDeps (typescript, @types/*, etc.) during build, so override.
        - npm ci --include=dev --cache .npm --prefer-offline
        # Bake Amplify console env vars into .env.production so they reach
        # the SSR Lambda at runtime. Amplify's console env vars are
        # build-time-only by default; Next.js reads .env.production at runtime.
        - echo "DATABASE_URL=$DATABASE_URL" >> .env.production
        - echo "AUTH_SECRET=$AUTH_SECRET" >> .env.production
        - echo "AUTH_GOOGLE_ID=$AUTH_GOOGLE_ID" >> .env.production
        - echo "AUTH_GOOGLE_SECRET=$AUTH_GOOGLE_SECRET" >> .env.production
        - echo "AUTH_ALLOWED_EMAIL_DOMAINS=$AUTH_ALLOWED_EMAIL_DOMAINS" >> .env.production
        - echo "AUTH_URL=$AUTH_URL" >> .env.production
        # Email send (RFQs). Add these in Amplify env vars to enable.
        - echo "RESEND_API_KEY=$RESEND_API_KEY" >> .env.production
        - echo "EMAIL_FROM=$EMAIL_FROM" >> .env.production
        - echo "DEV_EMAIL_REDIRECT=$DEV_EMAIL_REDIRECT" >> .env.production
        # DocParser webhook auth — must be set in Amplify env vars before
        # bills can be posted to /api/bills/inbound.
        - echo "BILLS_INBOUND_SECRET=$BILLS_INBOUND_SECRET" >> .env.production
        # QBO integration. Sandbox = Intuit Developer "Development" keys,
        # only talks to sandbox companies. Production keys (separate vars,
        # added later when Intuit approves the app) talk to real companies.
        # QBO_TOKEN_ENC_KEY is a 32-byte hex string used to AES-encrypt
        # OAuth tokens at rest in the qbo_connections table.
        - echo "QBO_CLIENT_ID_SANDBOX=$QBO_CLIENT_ID_SANDBOX" >> .env.production
        - echo "QBO_CLIENT_SECRET_SANDBOX=$QBO_CLIENT_SECRET_SANDBOX" >> .env.production
        - echo "QBO_CLIENT_ID_PRODUCTION=$QBO_CLIENT_ID_PRODUCTION" >> .env.production
        - echo "QBO_CLIENT_SECRET_PRODUCTION=$QBO_CLIENT_SECRET_PRODUCTION" >> .env.production
        - echo "QBO_TOKEN_ENC_KEY=$QBO_TOKEN_ENC_KEY" >> .env.production
        - echo "QBO_ENVIRONMENT=$QBO_ENVIRONMENT" >> .env.production
        - echo "QBO_DRY_RUN=$QBO_DRY_RUN" >> .env.production
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
